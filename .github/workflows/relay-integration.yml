name: Relay integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3"

permissions:
  contents: read

concurrency:
  group: relay-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-relay:
    name: Full post-quantum relay suite
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NOCTBOARD_BUILD_PATH: ${{ runner.temp }}/noctboard-release-build
      NOCTBOARD_RUN_RELAY_INTEGRATION: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Confirm supported toolchain and architecture
        run: |
          swift --version
          test "$(uname -m)" = "arm64"

      - name: Resolve the pinned dependency graph
        run: |
          swift package --scratch-path "$NOCTBOARD_BUILD_PATH" resolve
          git diff --exit-code -- Package.resolved

      - name: Run full release-configuration tests
        run: swift test -c release --scratch-path "$NOCTBOARD_BUILD_PATH"

      - name: Run release demo
        run: swift run -c release --scratch-path "$NOCTBOARD_BUILD_PATH" NoctBoardDemo
