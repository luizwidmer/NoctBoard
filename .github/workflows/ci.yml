name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Swift 6 fast suite
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm supported toolchain and architecture
        run: |
          swift --version
          test "$(uname -m)" = "arm64"

      - name: Resolve the pinned dependency graph
        run: |
          swift package --scratch-path "$RUNNER_TEMP/noctboard-fast-build" resolve
          git diff --exit-code -- Package.resolved

      - name: Build
        run: swift build --scratch-path "$RUNNER_TEMP/noctboard-fast-build"

      - name: Run deterministic tests
        run: swift test --scratch-path "$RUNNER_TEMP/noctboard-fast-build"

      - name: Run public-surface smokes
        run: |
          swift run --scratch-path "$RUNNER_TEMP/noctboard-fast-build" NoctBoardDemo
          swift run --scratch-path "$RUNNER_TEMP/noctboard-fast-build" noctboard help >/dev/null

      - name: Check patch hygiene
        run: git diff --check
