name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Swift 6 fast suite
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NOCTBOARD_BUILD_PATH: ${{ runner.temp }}/noctboard-fast-build

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Confirm supported toolchain and architecture
        run: |
          swift --version
          test "$(uname -m)" = "arm64"

      - name: Resolve the pinned dependency graph
        run: |
          swift package --scratch-path "$NOCTBOARD_BUILD_PATH" resolve
          git diff --exit-code -- Package.resolved

      - name: Build
        run: swift build --scratch-path "$NOCTBOARD_BUILD_PATH"

      - name: Run deterministic tests
        run: swift test --scratch-path "$NOCTBOARD_BUILD_PATH"

      - name: Run public-surface smokes
        run: |
          swift run --scratch-path "$NOCTBOARD_BUILD_PATH" NoctBoardDemo
          swift run --scratch-path "$NOCTBOARD_BUILD_PATH" noctboard help >/dev/null

      - name: Check patch hygiene
        run: git diff --check
