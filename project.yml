{
  "name": "NoctBoard",
  "options": {
    "minimumXcodeGenVersion": "2.46.0",
    "deploymentTarget": {
      "macOS": "14.0"
    }
  },
  "settings": {
    "base": {
      "DEVELOPMENT_TEAM": "9MY7SXN56X",
      "CODE_SIGN_STYLE": "Automatic",
      "SWIFT_VERSION": "6.0",
      "MACOSX_DEPLOYMENT_TARGET": "14.0",
      "CURRENT_PROJECT_VERSION": "6",
      "MARKETING_VERSION": "0.1.0",
      "DEBUG_INFORMATION_FORMAT": "dwarf-with-dsym",
      "ENABLE_HARDENED_RUNTIME": "YES",
      "ENABLE_APP_SANDBOX": "YES",
      "ENABLE_USER_SCRIPT_SANDBOXING": "YES",
      "ARCHS": "arm64"
    }
  },
  "packages": {
    "NoctBoardLocal": {
      "path": "."
    }
  },
  "targets": {
    "NoctBoardApp": {
      "type": "application",
      "platform": "macOS",
      "sources": [
        {
          "path": "Sources/NoctBoardApp"
        },
        {
          "path": "Packaging/NoctBoard.icns",
          "buildPhase": "resources"
        },
        {
          "path": "Packaging/PrivacyInfo.xcprivacy",
          "buildPhase": "resources"
        }
      ],
      "settings": {
        "base": {
          "PRODUCT_NAME": "NoctBoard",
          "EXECUTABLE_NAME": "NoctBoardApp",
          "PRODUCT_BUNDLE_IDENTIFIER": "org.noctboard.audit-console",
          "INFOPLIST_FILE": "Packaging/Info.plist",
          "GENERATE_INFOPLIST_FILE": "NO",
          "CODE_SIGN_ENTITLEMENTS": "Packaging/NoctBoardApp.entitlements"
        }
      },
      "dependencies": [
        {
          "package": "NoctBoardLocal",
          "product": "NoctBoardUI"
        }
      ]
    }
  },
  "schemes": {
    "NoctBoard": {
      "build": {
        "targets": {
          "NoctBoardApp": "all"
        }
      },
      "run": {
        "config": "Debug",
        "storeKitConfiguration": "SupportTips.storekit"
      },
      "archive": {
        "config": "Release"
      }
    }
  }
}
